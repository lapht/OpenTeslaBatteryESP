# One-off: creates labels and milestones. Removed in the next commit.
name: bootstrap-roadmap
on:
  push:
    branches: [claude/project-thread-bbgawx]
    paths: [.github/workflows/bootstrap-roadmap.yml]
permissions:
  issues: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Labels
        run: |
          lbl() { gh label create "$1" -R "$R" --color "$2" --description "$3" --force; }
          lbl validation  0e8a16 "Checked against a reference tool on a real car"
          lbl can         1d76db "CAN bus, TWAI, decoding"
          lbl firmware    5319e7 "ESP32 firmware"
          lbl web-ui      fbca04 "Web page and HTTP API"
          lbl hardware    b60205 "Boards, wiring, harness, PCB"
          lbl power       d93f0b "Power management and 12 V drain"
          lbl ci          c5def5 "Build and CI"
          lbl mvp         000000 "Required for the MVP"
      - name: Milestones
        run: |
          ms() { gh api "repos/$R/milestones" -f title="$1" -f description="$2" >/dev/null && echo "created $1"; }
          ms "v0.1 MVP"            "Listen-only 500k, decode 0x292/0x352, SOH + degradation, web page with SOH and capacity. Validated on Model 3 LR AWD 2021."
          ms "v0.2 Telemetry"      "Brick voltages and spread, pack voltage/current, range at 100%, equivalent cycles, live charts over WebSocket."
          ms "v0.3 Vehicle info"   "Gateway config, basic BMS alert decoding, LFP detection with warning."
          ms "v0.4 Power & history" "Deep sleep, 12 V drain measurement, SOH history on flash/SD, optional STA mode."
          ms "v1.0"                "Model Y support, Model 3 2017-2024 coverage, complete hardware docs, showcase site with browser flashing."
          ms "Future"              "Dedicated PCB, prebuilt release binaries."
          gh api "repos/$R/milestones" --jq '.[] | "\(.number) \(.title)"'
