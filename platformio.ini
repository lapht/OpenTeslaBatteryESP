; OpenTeslaBatteryESP - PlatformIO configuration
; Arduino-ESP32 core 3.x via the pioarduino platform (needed for ESP32-C6).

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.11.2
    bblanchon/ArduinoJson @ 7.4.2

; Primary target: classic ESP32 DevKitC (WROOM-32)
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DOTB_CAN_TX_PIN=5
    -DOTB_CAN_RX_PIN=4

; Secondary target: ESP32-C6 DevKitC-1
[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DOTB_CAN_TX_PIN=5
    -DOTB_CAN_RX_PIN=4

; Host-side unit tests for decoders and calculations (no hardware needed)
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++17 -Isrc
build_src_filter = -<*>
test_build_src = no
